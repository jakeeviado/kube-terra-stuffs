# tells k8s to run a PostgreSQL container inside the cluster and exposes it to other apps in the cluster
# the docker-compose.yml has nothing to with this config, but it works similarly

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: healthch-dev
            - name: POSTGRES_PASSWORD
              value: Changeme0
            - name: POSTGRES_DB
              value: healthch
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432