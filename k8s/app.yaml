# this file deploys the application and makes it accessible from the host machine

apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthch-app
  labels:
    app: healthch-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthch-app
  template:
    metadata:
      labels:
        app: healthch-app
    spec:
      containers:
        - name: healthch-app
          image: healthch-core:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: healthch-config
---
apiVersion: v1
kind: Service
metadata:
  name: healthch-service
spec:
  type: NodePort
  selector:
    app: healthch-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080